name: Android APK

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Mikrozz APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      GODOT_VERSION: 4.4.1
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Read project settings
        shell: bash
        run: |
          set -a
          source .env
          set +a
          echo "GODOT_VERSION=$GODOT_RELEASE" >> "$GITHUB_ENV"
          echo "ANDROID_PACKAGE=$ANDROID_PACKAGE" >> "$GITHUB_ENV"

      - name: Install Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android platforms and build tools
        run: |
          yes | sdkmanager --licenses >/dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install Godot
        shell: bash
        run: |
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -O godot.zip
          unzip -q godot.zip -d godot-bin
          GODOT_BIN="$(find godot-bin -type f -name 'Godot_v*' | head -n 1)"
          chmod +x "$GODOT_BIN"
          echo "GODOT_BIN=$GITHUB_WORKSPACE/$GODOT_BIN" >> "$GITHUB_ENV"

      - name: Install matching export templates
        shell: bash
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          wget -q "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz" -O templates.tpz
          unzip -q templates.tpz -d templates
          test -d templates/templates
          cp -a templates/templates/. "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable/"

      - name: Configure Android SDK for Godot
        shell: bash
        run: |
          mkdir -p "$HOME/.config/godot"
          cat > "$HOME/.config/godot/editor_settings-4.4.tres" <<EOF
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/android_sdk_path = "$ANDROID_SDK_ROOT"
          export/android/java_sdk_path = "$JAVA_HOME"
          EOF

      - name: Create CI debug signing key
        run: |
          keytool -genkeypair -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Preheat editor and import resources
        run: |
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --import
          "$GODOT_BIN" --headless --editor --path "$GITHUB_WORKSPACE" --quit

      - name: Run headless gameplay smoke test
        shell: bash
        run: |
          set -o pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --quit-after 120 2>&1 | tee runtime-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|ERROR:" runtime-smoke.log; then
            echo "Godot runtime smoke test reported errors"
            exit 1
          fi

      - name: Simulate generated levels 0-10
        shell: bash
        run: |
          cat > /tmp/mikrozz_level_test.gd <<'GDSCRIPT'
          extends SceneTree
          const Maze = preload("res://scripts/MazeGenerator.gd")

          func _initialize() -> void:
            call_deferred("_run_tests")

          func _run_tests() -> void:
            var generator = Maze.new()
            root.add_child(generator)
            var previous_special_count = 0
            for level in range(0, 11):
              generator.generate(level, Vector2(480, 854))
              await process_frame
              assert(generator.solution.size() >= 4, "Level %d has no usable route" % level)
              assert(generator.start_cell != generator.target_cell, "Level %d start equals exit" % level)
              assert(generator.gate_bodies.size() <= 3, "Level %d has too many gates" % level)
              if level >= 5:
                assert(generator.gate_bodies.size() == 3, "Level %d must expose all three multi-touch gates" % level)
              assert(generator.special_mechanic_count >= previous_special_count, "Level %d lost its mechanic progression" % level)
              previous_special_count = generator.special_mechanic_count
              var coins = 0
              for child in generator.get_children():
                if child is RigidBody2D and child.is_in_group("coins"):
                  coins += 1
              assert(coins >= 3, "Level %d has too few collectibles" % level)
              for i in range(generator.solution.size() - 1):
                var a: Vector2i = generator.solution[i]
                var b: Vector2i = generator.solution[i + 1]
                var delta: Vector2i = b - a
                var direction = -1
                if delta == Vector2i(0, -1): direction = 0
                elif delta == Vector2i(1, 0): direction = 1
                elif delta == Vector2i(0, 1): direction = 2
                elif delta == Vector2i(-1, 0): direction = 3
                assert(direction >= 0, "Level %d route contains a non-adjacent step" % level)
                assert(generator.cells[a.y][a.x]["walls"][direction] == false, "Level %d route crosses a closed wall" % level)
              if not generator.gate_bodies.is_empty():
                generator.set_gate_button_state(0, true)
                if level >= 5:
                  generator.set_gate_button_state(1, true)
                  assert(not generator.gate_button_states[2], "Level %d opened the combo gate too early" % level)
                  generator.set_gate_button_state(2, true)
                  await process_frame
                  var combo_shape = generator.gate_bodies[2].get_child(0) as CollisionShape2D
                  assert(combo_shape.disabled, "Level %d combo gate did not open with three fingers" % level)
                  generator.set_gate_button_state(1, false)
                  await process_frame
                  assert(not combo_shape.disabled, "Level %d combo gate stayed open after a finger lifted" % level)
                generator.set_gate_button_state(0, false)
              print("LEVEL_TEST_OK level=%d path=%d coins=%d gates=%d mechanics=%d" % [level, generator.solution.size(), coins, generator.gate_bodies.size(), generator.special_mechanic_count])
            print("ALL_LEVELS_0_TO_10_OK")
            quit(0)
          GDSCRIPT
          set -o pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script /tmp/mikrozz_level_test.gd 2>&1 | tee level-simulation.log
          if grep -E "SCRIPT ERROR|Parse Error|Assertion failed|ERROR:" level-simulation.log; then
            echo "Level simulation reported errors"
            exit 1
          fi
          grep -q "ALL_LEVELS_0_TO_10_OK" level-simulation.log

      - name: Validate endless generator and camera-scale worlds
        shell: bash
        run: |
          cat > /tmp/mikrozz_endless_test.gd <<'GDSCRIPT'
          extends SceneTree
          const Maze = preload("res://scripts/MazeGenerator.gd")

          func _initialize() -> void:
            call_deferred("_run_tests")

          func _run_tests() -> void:
            var test_levels = [11, 12, 13, 14, 15, 19, 23, 27, 31, 35, 39, 43, 47, 51, 55, 59, 62, 63, 100]
            for level in test_levels:
              var generator = Maze.new()
              root.add_child(generator)
              generator.generate(level, Vector2(480, 854), 710000 + level)
              await process_frame
              var expected_theme = int((level - 11) / 4) % 13
              assert(generator.theme_id == expected_theme, "Wrong theme for level %d" % level)
              assert(generator.solution.size() >= 4, "Missing full route at level %d" % level)
              assert(generator.solution[0] == generator.start_cell, "Wrong route start at level %d" % level)
              assert(generator.solution[generator.solution.size() - 1] == generator.target_cell, "Wrong route finish at level %d" % level)
              var inside_count = 0
              var visited = {}
              for y in range(generator.rows):
                for x in range(generator.cols):
                  if generator.cells[y][x]["inside"]:
                    inside_count += 1
              for cell in generator.solution:
                visited[cell] = true
              assert(visited.size() == inside_count, "Route does not cover every cell at level %d" % level)
              assert(generator.get_coverage_percent() < 100.0, "Coverage should require real player movement at level %d" % level)
              for y in range(generator.rows):
                for x in range(generator.cols):
                  if generator.cells[y][x]["inside"]:
                    generator._mark_visited_world_position(generator._cell_center(Vector2i(x, y)))
              assert(generator.get_coverage_percent() >= 99.9, "Coverage tracker failed at level %d" % level)
              assert(generator.get_visited_cells().size() == inside_count, "Visited-cell save data incomplete at level %d" % level)
              var wall_body = generator.get_node_or_null("BatchedMazeWalls")
              assert(wall_body != null and generator.wall_count > 0, "Batched wall collision missing at level %d" % level)
              var object_snapshot = generator.get_level_snapshot()
              var snapshot_restored = false
              for snapshot_child in generator.get_children():
                if snapshot_child is Node2D and snapshot_child.has_meta("level_save_key"):
                  var snapshot_node = snapshot_child as Node2D
                  var original_position: Vector2 = snapshot_node.position
                  snapshot_node.position += Vector2(7.0, 9.0)
                  generator.apply_level_snapshot(object_snapshot)
                  assert(snapshot_node.position.distance_to(original_position) < 0.1, "Mechanic snapshot restore failed at level %d" % level)
                  snapshot_restored = true
                  break
              assert(snapshot_restored, "No stateful maze objects available for snapshot test at level %d" % level)
              assert(is_equal_approx(generator.cell_size_x * generator.cell_size_y, 3600.0), "Logical cell area changed at level %d" % level)
              assert(generator.gate_bodies.size() <= 3, "Too many gates at level %d" % level)
              for i in range(generator.solution.size() - 1):
                var a: Vector2i = generator.solution[i]
                var b: Vector2i = generator.solution[i + 1]
                var delta: Vector2i = b - a
                var direction = -1
                if delta == Vector2i(0, -1): direction = 0
                elif delta == Vector2i(1, 0): direction = 1
                elif delta == Vector2i(0, 1): direction = 2
                elif delta == Vector2i(-1, 0): direction = 3
                assert(direction >= 0, "Non-adjacent route step at level %d" % level)
                assert(generator.cells[a.y][a.x]["walls"][direction] == false, "Route crosses a wall at level %d" % level)
              var trap_count = 0
              var sequence_plate_count = 0
              for child in generator.get_children():
                if child is Node2D and child.is_in_group("maze_trap"):
                  trap_count += 1
                  var trap_cell := Vector2i(
                    clampi(int((child.position.x - generator.origin.x) / generator.cell_size_x), 0, generator.cols - 1),
                    clampi(int((child.position.y - generator.origin.y) / generator.cell_size_y), 0, generator.rows - 1)
                  )
                  assert(generator._safe_neighbor_count(trap_cell) >= 3, "Trap has fewer than three bypass sides at level %d" % level)
                if child.is_in_group("puzzle_plates"):
                  sequence_plate_count += 1
              if expected_theme == 12:
                assert(sequence_plate_count == generator.sequence_length, "Sequence length mismatch at level %d" % level)
              elif expected_theme in [0, 7, 10]:
                assert(trap_count > 0, "Themed trap series generated no traps at level %d" % level)
              else:
                assert(trap_count == 0, "Foreign trap mixed into theme %d at level %d" % [expected_theme, level])
              var verifier = Maze.new()
              root.add_child(verifier)
              verifier.generate(level, Vector2(480, 854), 710000 + level)
              verifier.restore_visited_cells(generator.get_visited_cells())
              assert(verifier.get_coverage_percent() >= 99.9, "Visited-cell restoration failed at level %d" % level)
              assert(generator.solution == verifier.solution, "Seed is not deterministic at level %d" % level)
              var tested_cols = generator.cols
              var tested_rows = generator.rows
              generator.queue_free()
              verifier.queue_free()
              await process_frame
              print("ENDLESS_LEVEL_OK level=%d theme=%d size=%dx%d" % [level, expected_theme, tested_cols, tested_rows])
            print("ALL_ENDLESS_GENERATOR_TESTS_OK")
            quit(0)
          GDSCRIPT
          set -o pipefail
          "$GODOT_BIN" --headless --path "$GITHUB_WORKSPACE" --script /tmp/mikrozz_endless_test.gd 2>&1 | tee endless-simulation.log
          if grep -E "SCRIPT ERROR|Parse Error|Assertion failed|ERROR:" endless-simulation.log; then
            echo "Endless generator simulation reported errors"
            exit 1
          fi
          grep -q "ALL_ENDLESS_GENERATOR_TESTS_OK" endless-simulation.log

      - name: Export debug APK
        run: |
          mkdir -p build
          echo "Android SDK: $ANDROID_SDK_ROOT"
          test -d "$ANDROID_SDK_ROOT/platform-tools"
          test -d "$ANDROID_SDK_ROOT/platforms/android-35"
          test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"
          "$GODOT_BIN" --headless --verbose --path "$GITHUB_WORKSPACE" --export-debug "Android" "build/PastelMaze.apk"

      - name: Verify APK
        run: |
          test -s build/PastelMaze.apk
          ls -lh build/PastelMaze.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PastelMaze-Android
          path: build/PastelMaze.apk
          if-no-files-found: error
          retention-days: 14
